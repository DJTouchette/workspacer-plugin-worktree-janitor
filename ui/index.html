<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Worktree Janitor</title>
<style>
  /* Chrome wears workspacer theme tokens. Status colors are reserved for
     state (merged/dirty/prunable) and always ship with a text label. */
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--wks-bg-base, #17171a);
    color: var(--wks-text-primary, #dcdce6);
    font-size: 13px; overflow-y: auto;
  }
  #root { max-width: 900px; margin: 0 auto; padding: 18px 22px 32px; }
  #head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  #head h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  #head .sub { font-size: 11px; color: var(--wks-text-faint, #777); }
  #spacer { flex: 1; }
  #rescan {
    font-size: 11.5px; font-family: inherit; font-weight: 600; cursor: pointer;
    padding: 4px 14px; border-radius: 999px; border: 1px solid var(--wks-border-subtle, #2a2a2a);
    background: transparent; color: var(--wks-text-muted, #999);
  }
  #rescan:hover { color: var(--wks-accent-text, #60a5fa); border-color: var(--wks-accent, #5078c8); }

  .repo {
    background: var(--wks-bg-raised, #1c1c20);
    border: 1px solid var(--wks-border-subtle, #2a2a2a);
    border-radius: 13px; margin-bottom: 14px; overflow: hidden;
  }
  .repohead { display: flex; align-items: baseline; gap: 8px; padding: 12px 16px 10px; }
  .repohead .name { font-size: 13px; font-weight: 650; }
  .repohead .path { font-size: 10.5px; color: var(--wks-text-faint, #777); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .repohead .def { font-size: 10px; color: var(--wks-text-muted, #999); flex-shrink: 0; margin-left: auto; }

  .wt {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-top: 1px solid color-mix(in srgb, var(--wks-border-subtle, #2a2a2a) 60%, transparent);
  }
  .wt:hover { background: color-mix(in srgb, var(--wks-bg-hover, #26262c) 55%, transparent); }
  .wt .branch { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; }
  .wt .meta { font-size: 10.5px; color: var(--wks-text-faint, #777); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wt .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .badges { display: flex; gap: 5px; flex-shrink: 0; }
  .badge {
    font-size: 9.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px;
    letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap;
  }
  .b-merged { color: var(--wks-success, #4ade80); border: 1px solid color-mix(in srgb, var(--wks-success, #4ade80) 40%, transparent); background: color-mix(in srgb, var(--wks-success, #4ade80) 10%, transparent); }
  .b-dirty { color: var(--wks-warning, #facc15); border: 1px solid color-mix(in srgb, var(--wks-warning, #facc15) 40%, transparent); background: color-mix(in srgb, var(--wks-warning, #facc15) 10%, transparent); }
  .b-agent { color: var(--wks-accent-text, #60a5fa); border: 1px solid color-mix(in srgb, var(--wks-accent, #5078c8) 45%, transparent); background: color-mix(in srgb, var(--wks-accent, #5078c8) 12%, transparent); text-transform: none; }
  .b-gone { color: var(--wks-error, #f87171); border: 1px solid color-mix(in srgb, var(--wks-error, #f87171) 40%, transparent); background: color-mix(in srgb, var(--wks-error, #f87171) 10%, transparent); }
  .age { font-size: 10.5px; color: var(--wks-text-muted, #999); width: 52px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }

  .prune {
    font-size: 11px; font-family: inherit; font-weight: 600; cursor: pointer; flex-shrink: 0;
    padding: 3px 12px; border-radius: 7px; border: 1px solid var(--wks-border-subtle, #2a2a2a);
    background: transparent; color: var(--wks-text-muted, #999);
  }
  .prune:hover { color: var(--wks-error, #f87171); border-color: color-mix(in srgb, var(--wks-error, #f87171) 50%, transparent); }
  .prune:disabled { opacity: 0.45; cursor: default; }

  /* Inline confirm strip (replaces the row's actions on prune click). */
  .confirm { display: flex; align-items: center; gap: 8px; font-size: 11px; }
  .confirm label { display: flex; align-items: center; gap: 4px; color: var(--wks-text-muted, #999); cursor: pointer; }
  .confirm .go {
    font-size: 11px; font-weight: 700; cursor: pointer; padding: 3px 12px; border-radius: 7px;
    border: none; background: var(--wks-error, #b91c1c); color: #fff;
  }
  .confirm .no { font-size: 11px; cursor: pointer; padding: 3px 8px; border-radius: 7px; border: none; background: transparent; color: var(--wks-text-muted, #999); }

  .cleanrow { padding: 12px 16px; font-size: 11.5px; color: var(--wks-text-faint, #777); border-top: 1px solid color-mix(in srgb, var(--wks-border-subtle, #2a2a2a) 60%, transparent); }
  .empty { padding: 46px 0; text-align: center; color: var(--wks-text-faint, #777); font-size: 12.5px; line-height: 1.7; }
  #err { color: var(--wks-error, #f87171); font-size: 11px; }
</style>
</head>
<body>
  <div id="root">
    <div id="head">
      <h1>Worktree Janitor</h1>
      <span class="sub" id="sub"></span>
      <span id="spacer"></span>
      <span id="err"></span>
      <button id="rescan">↻ Rescan</button>
    </div>
    <div id="content"><div class="empty">Scanning worktrees…</div></div>
  </div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const base = (p) => p.replace(/[/\\]+$/, '').split(/[/\\]/).pop();
  const age = (epoch) => {
    if (!epoch) return '—';
    const d = Math.floor((Date.now() / 1000 - epoch) / 86400);
    if (d < 1) return 'today';
    if (d < 30) return d + 'd';
    return Math.floor(d / 30) + 'mo';
  };

  let repos = [];
  let confirming = null; // worktree path with the confirm strip open

  async function scan() {
    $('err').textContent = '';
    try {
      const res = await fetch('/api/worktrees');
      repos = await res.json();
      if (!Array.isArray(repos)) throw new Error(repos.error || 'bad response');
    } catch (e) {
      $('content').innerHTML = `<div class="empty">Scan failed: ${esc(e.message)}</div>`;
      return;
    }
    render();
  }

  function render() {
    const total = repos.reduce((n, r) => n + r.worktrees.length, 0);
    $('sub').textContent = `${repos.length} repo${repos.length === 1 ? '' : 's'} · ${total} linked worktree${total === 1 ? '' : 's'}`;
    if (repos.length === 0) {
      $('content').innerHTML = '<div class="empty">No agent repositories found.<br/>Spawn some agents and rescan.</div>';
      return;
    }
    $('content').innerHTML = '';
    for (const repo of repos) $('content').appendChild(renderRepo(repo));
  }

  function renderRepo(repo) {
    const el = document.createElement('div');
    el.className = 'repo';
    el.innerHTML = `
      <div class="repohead">
        <span class="name">${esc(base(repo.repo))}</span>
        <span class="path">${esc(repo.repo)}</span>
        <span class="def">${repo.defaultBranch ? '⎇ ' + esc(repo.defaultBranch) : ''}</span>
      </div>`;
    if (repo.worktrees.length === 0) {
      el.insertAdjacentHTML('beforeend', '<div class="cleanrow">No linked worktrees — clean. ✓</div>');
      return el;
    }
    for (const wt of repo.worktrees) el.appendChild(renderWt(wt));
    return el;
  }

  function renderWt(wt) {
    const row = document.createElement('div');
    row.className = 'wt';
    const badges = [
      wt.prunable ? '<span class="badge b-gone">✗ missing</span>' : '',
      wt.merged ? '<span class="badge b-merged">✓ merged</span>' : '',
      wt.dirty ? `<span class="badge b-dirty">● ${wt.dirty} dirty</span>` : '',
      ...wt.agents.map((a) => `<span class="badge b-agent">🤖 ${esc(a)}</span>`),
      wt.locked ? '<span class="badge b-dirty">🔒 locked</span>' : '',
    ].filter(Boolean).join('');
    row.innerHTML = `
      <div class="main">
        <span class="branch">${wt.detached ? '(detached)' : esc(wt.branch || '?')}</span>
        <span class="meta" title="${esc(wt.path)}">${esc(wt.path)}${wt.lastCommitSubject ? ' — ' + esc(wt.lastCommitSubject) : ''}</span>
      </div>
      <div class="badges">${badges}</div>
      <span class="age" title="last commit">${age(wt.lastCommitEpoch)}</span>
      <span class="actions"></span>`;
    const actions = row.querySelector('.actions');
    if (confirming === wt.path) {
      const c = document.createElement('span');
      c.className = 'confirm';
      const needForce = wt.dirty > 0;
      c.innerHTML = `
        ${needForce ? '<span style="color:var(--wks-warning,#facc15)">discards ' + wt.dirty + ' change(s)</span>' : ''}
        ${wt.merged && wt.branch ? `<label><input type="checkbox" id="delbr" checked /> delete branch</label>` : ''}
        <button class="go">Remove</button><button class="no">Cancel</button>`;
      c.querySelector('.go').onclick = async () => {
        const delbr = c.querySelector('#delbr');
        try {
          const res = await fetch('/api/prune', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ path: wt.path, force: needForce || wt.prunable, deleteBranch: !!(delbr && delbr.checked) }),
          });
          const out = await res.json();
          if (out.error) throw new Error(out.error);
          confirming = null;
          await scan();
        } catch (e) { $('err').textContent = e.message; }
      };
      c.querySelector('.no').onclick = () => { confirming = null; render(); };
      actions.appendChild(c);
    } else {
      const btn = document.createElement('button');
      btn.className = 'prune';
      btn.textContent = 'Prune';
      btn.title = wt.agents.length ? 'An agent is working here — prune anyway?' : 'Remove this worktree';
      btn.onclick = () => { confirming = wt.path; render(); };
      actions.appendChild(btn);
    }
    return row;
  }

  $('rescan').onclick = scan;
  scan();
})();
</script>
</body>
</html>
